<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQUIPORT - Dashboard de Aderência</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) para leitura e exportação de arquivos Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        equiport: {
                            red: '#E30613',
                            'dark-bg': '#1E2336',
                            'darker-bg': '#151826',
                            'card-dark': '#262D45'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-equiport-darker-bg text-gray-100 min-h-screen flex flex-col font-sans">
    <header class="bg-equiport-dark-bg border-b border-gray-800 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-equiport-red p-2.5 rounded-xl text-white shadow-lg shadow-equiport-red/30">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide text-white">EQUIPORT</h1>
                    <p class="text-xs text-gray-400">Dashboard de Aderência de Relatórios</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <label for="import-excel-input" class="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm font-medium cursor-pointer transition flex items-center space-x-2 shadow">
                    <i class="fa-solid fa-file-excel text-green-400"></i>
                    <span>Importar Excel</span>
                </label>
                <input type="file" id="import-excel-input" accept=".xlsx, .xls" class="hidden">
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="bg-equiport-card-dark p-5 rounded-2xl border border-gray-800 shadow-sm flex items-center space-x-4">
                <div class="p-3 bg-blue-500/10 text-blue-400 rounded-xl"><i class="fa-solid fa-file-lines text-2xl"></i></div>
                <div>
                    <p class="text-xs text-gray-400 font-medium uppercase">Total de Relatórios</p>
                    <h3 id="stat-total" class="text-2xl font-bold text-white mt-0.5">0</h3>
                </div>
            </div>
            <div class="bg-equiport-card-dark p-5 rounded-2xl border border-gray-800 shadow-sm flex items-center space-x-4">
                <div class="p-3 bg-green-500/10 text-green-400 rounded-xl"><i class="fa-solid fa-circle-check text-2xl"></i></div>
                <div>
                    <p class="text-xs text-gray-400 font-medium uppercase">Aderentes</p>
                    <h3 id="stat-aderentes" class="text-2xl font-bold text-white mt-0.5">0</h3>
                </div>
            </div>
            <div class="bg-equiport-card-dark p-5 rounded-2xl border border-gray-800 shadow-sm flex items-center space-x-4">
                <div class="p-3 bg-red-500/10 text-red-400 rounded-xl"><i class="fa-solid fa-triangle-exclamation text-2xl"></i></div>
                <div>
                    <p class="text-xs text-gray-400 font-medium uppercase">Não Aderentes</p>
                    <h3 id="stat-nao-aderentes" class="text-2xl font-bold text-white mt-0.5">0</h3>
                </div>
            </div>
            <div class="bg-equiport-card-dark p-5 rounded-2xl border border-gray-800 shadow-sm flex items-center space-x-4">
                <div class="p-3 bg-purple-500/10 text-purple-400 rounded-xl"><i class="fa-solid fa-percent text-2xl"></i></div>
                <div>
                    <p class="text-xs text-gray-400 font-medium uppercase">Taxa de Aderência</p>
                    <h3 id="stat-taxa" class="text-2xl font-bold text-white mt-0.5">0%</h3>
                </div>
            </div>
        </div>

        <div class="bg-equiport-card-dark p-6 rounded-2xl border border-gray-800 shadow-sm text-center py-16">
            <div class="max-w-md mx-auto space-y-4">
                <div class="w-16 h-16 bg-equiport-red/10 text-equiport-red rounded-full flex items-center justify-center mx-auto text-2xl">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                <h2 class="text-xl font-semibold text-white">Nenhum dado carregado na nuvem</h2>
                <p class="text-sm text-gray-400">Clique no botão "Importar Excel" no topo superior direito e insira sua planilha para sincronizar o painel com a equipe.</p>
            </div>
        </div>
    </main>

    <script>
        document.getElementById('import-excel-input').addEventListener('change', function(e) {
            const senha = prompt("Digite a senha de administrador para atualizar os dados:");
            if (senha !== "equiport2026") {
                alert("Senha incorreta!");
                e.target.value = '';
                return;
            }
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const data = new Uint8Array(evt.target.result);
                const workbook = XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const json = XLSX.utils.sheet_to_json(worksheet);
                
                localStorage.setItem('equiport_dashboard_data', JSON.stringify(json));
                alert("Planilha importada com sucesso e sincronizada!");
                location.reload();
            };
            reader.readAsArrayBuffer(file);
        });

        window.addEventListener('DOMContentLoaded', () => {
            const saved = localStorage.getItem('equiport_dashboard_data');
            if (saved) {
                const data = JSON.parse(saved);
                document.getElementById('stat-total').innerText = data.length;
                // Exemplo básico de contagem se houver dados salvos
            }
        });
    </script>
</body>
</html>
